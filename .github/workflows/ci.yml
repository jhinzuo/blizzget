# CI: build blizztools and upload release binary (debug-friendly)
# Place at .github/workflows/ci.yml
on:
  push:
    # during debugging let it run on any branch; change to ['main'] for strictness later
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ca-certificates build-essential

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Print environment (debug)
        run: |
          rustc --version || true
          cargo --version || true
          uname -a || true
          echo "CWD: $(pwd)"
          ls -la

      - name: Build (release)
        run: |
          cargo build --verbose --release

      - name: List built files (debug)
        run: |
          echo "Contents of target/release:"
          ls -la target/release || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blizztools-release
          path: target/release/**
